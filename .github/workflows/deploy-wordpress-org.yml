name: Deploy UploadSleuth to WordPress.org

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show the SVN diff without committing trunk, assets, or a release tag
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: wordpress-org-upload-sleuth
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy plugin, assets, and tag
    runs-on: ubuntu-latest
    environment: wordpress-org
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate plugin metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          plugin_version="$(sed -nE 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' upload-sleuth.php | head -n 1)"
          stable_version="$(sed -nE 's/^Stable tag:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' readme.txt | head -n 1)"

          if [[ -z "${plugin_version}" || "${plugin_version}" != "${stable_version}" ]]; then
            echo "Version mismatch: header=${plugin_version} stable-tag=${stable_version}" >&2
            exit 1
          fi

          echo "version=${plugin_version}" >> "${GITHUB_OUTPUT}"
          echo "Deploying UploadSleuth ${plugin_version}."

      - name: Install Subversion client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v svn >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes subversion
          fi
          svn --version --quiet

      - name: Prepare and validate SVN changes
        id: svn
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          SVN_URL="https://plugins.svn.wordpress.org/upload-sleuth"
          SVN_DIR="${RUNNER_TEMP}/upload-sleuth-svn"
          mkdir -p "${SVN_DIR}"
          svn checkout --depth immediates "${SVN_URL}" "${SVN_DIR}"
          svn update --set-depth infinity "${SVN_DIR}"

          mkdir -p "${SVN_DIR}/trunk" "${SVN_DIR}/assets" "${SVN_DIR}/tags"
          rsync -a --delete --exclude='.svn' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.wordpress-org' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='media-audit-*.zip' \
            --exclude='upload-sleuth-*.zip' \
            ./ "${SVN_DIR}/trunk/"
          rsync -a --delete --exclude='.svn' .wordpress-org/assets/ "${SVN_DIR}/assets/"

          svn add --force "${SVN_DIR}/trunk" "${SVN_DIR}/assets" >/dev/null
          while IFS= read -r missing_path; do
            [[ -n "${missing_path}" ]] && svn delete --force "${missing_path}"
          done < <(svn status "${SVN_DIR}/trunk" "${SVN_DIR}/assets" | sed -n 's/^!       //p')

          echo "SVN changes:"
          svn status "${SVN_DIR}/trunk" "${SVN_DIR}/assets"
          svn diff "${SVN_DIR}/trunk" "${SVN_DIR}/assets"

          if [[ "${DRY_RUN}" == "true" ]]; then
            echo "Dry run complete. No SVN changes were committed."
            exit 0
          fi

          if [[ -z "${SVN_USERNAME}" || -z "${SVN_PASSWORD}" ]]; then
            echo "SVN_USERNAME and SVN_PASSWORD secrets are required for a real deployment." >&2
            exit 1
          fi

          svn commit "${SVN_DIR}/trunk" "${SVN_DIR}/assets" \
            --username "${SVN_USERNAME}" \
            --password "${SVN_PASSWORD}" \
            --non-interactive \
            --no-auth-cache \
            --message "Deploy UploadSleuth ${RELEASE_VERSION}"

          svn copy "${SVN_URL}/trunk" "${SVN_URL}/tags/${RELEASE_VERSION}" \
            --username "${SVN_USERNAME}" \
            --password "${SVN_PASSWORD}" \
            --non-interactive \
            --no-auth-cache \
            --message "Tag UploadSleuth ${RELEASE_VERSION}"
